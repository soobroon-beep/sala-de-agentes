name: Publicar panel · solo por solicitud del propietario
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sala-publicacion-manual
  cancel-in-progress: false
jobs:
  publicar:
    name: Publicación manual autorizada del panel
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/package_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
