name: Sala · auditorías y reportes
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']
concurrency:
  group: sala-supervision
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  auditores:
    name: Auditor · ${{ matrix.agente }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agente: [vortex, novahub, neural, discord, bots]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/monitor.py auditor --agent "${{ matrix.agente }}" --output out
      - name: Pruebas de código aisladas
        if: matrix.agente != 'discord'
        run: python3 scripts/functional.py "${{ matrix.agente }}" --output out
      - name: Revisar procesos de conexión y aprendizaje
        run: python3 scripts/integrations.py "${{ matrix.agente }}" out
        env:
          GH_READ_TOKEN: ${{ github.token }}
      - name: Instalar navegador de auditoría
        if: matrix.agente == 'vortex' || matrix.agente == 'novahub' || matrix.agente == 'neural'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Navegación anónima en computadora y móvil
        if: matrix.agente == 'vortex' || matrix.agente == 'novahub' || matrix.agente == 'neural'
        run: node scripts/browser-audit.cjs "${{ matrix.agente }}" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditor-${{ matrix.agente }}
          path: out/*.json
          retention-days: 7
  gerente:
    name: Gerente · consolidar evidencia
    needs: auditores
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: auditor-*
          path: reports
          merge-multiple: true
      - run: python3 scripts/monitor.py gerente --input reports --output out
      - uses: actions/upload-artifact@v4
        with:
          name: gerente
          path: out/gerente.json
          retention-days: 7
  jefe:
    name: Gerente → tú (Jefe) · publicar reporte
    needs: gerente
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: gerente
          path: reports
      - run: python3 scripts/monitor.py jefe --input reports
      - name: Aviso de incidencias para el propietario
        continue-on-error: true
        run: python3 scripts/notify.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Guardar historial y último reporte
        run: |
          git config user.name "Sala de agentes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "Registrar revisión y reporte del Jefe"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: reporte-jefe
          path: data/*.json
          retention-days: 7
  publicar-panel:
    name: Publicar panel 3D y reporte
    needs: jefe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/package_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
