name: Sala · auditar y reportar (sin modificar producción)
on:
  schedule:
    - cron: '23 * * * *'
    - cron: '0 3,15 * * *'
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      ronda:
        description: Tipo de revisión
        type: choice
        required: true
        default: completa
        options: [ligera, completa, semanal]
concurrency:
  group: sala-supervision
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    name: Programador · America/Mexico_City
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ronda: ${{ steps.tipo.outputs.ronda }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: tipo
        run: python3 scripts/pipeline.py plan
        env:
          SALA_CRON: ${{ github.event.schedule }}
          SALA_RONDA: ${{ inputs.ronda || 'completa' }}
  auditores:
    name: Auditor · ${{ matrix.agente }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agente: [vortex, bots, neural, apps, discord]
    env:
      SALA_RONDA: ${{ needs.plan.outputs.ronda }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Salud de las aplicaciones públicas
        run: python3 scripts/pipeline.py auditor --agent "${{ matrix.agente }}" --output out
      - name: Procesos y conexiones de solo lectura
        run: python3 scripts/integrations.py "${{ matrix.agente }}" out
        env:
          GH_READ_TOKEN: ${{ github.token }}
      - name: Leer telemetría sanitizada de bots y cerebros
        if: matrix.agente == 'bots' || matrix.agente == 'neural'
        run: python3 scripts/telemetry.py "${{ matrix.agente }}" out
        env:
          GH_READ_TOKEN: ${{ github.token }}
      - name: Pruebas aisladas (solo ronda completa)
        if: needs.plan.outputs.ronda == 'completa' && matrix.agente != 'discord'
        run: python3 scripts/functional.py "${{ matrix.agente }}" --output out
      - name: Preparar navegador (solo ronda completa)
        if: needs.plan.outputs.ronda == 'completa' && (matrix.agente == 'vortex' || matrix.agente == 'apps' || matrix.agente == 'neural')
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Recorridos anónimos sin escrituras remotas
        if: needs.plan.outputs.ronda == 'completa' && (matrix.agente == 'vortex' || matrix.agente == 'apps' || matrix.agente == 'neural')
        run: node scripts/browser-audit.cjs "${{ matrix.agente }}" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditor-${{ matrix.agente }}
          path: out/*.json
          retention-days: 90
  gerente:
    name: Nivel 2 · Gerente · consolidar y verificar recibos
    needs: [plan, auditores]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SALA_RONDA: ${{ needs.plan.outputs.ronda }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: auditor-*
          path: reports
          merge-multiple: true
      - run: python3 scripts/pipeline.py gerente --input reports --output out
      - uses: actions/upload-artifact@v4
        with:
          name: gerente
          path: out/gerente.json
          retention-days: 90
  jefe:
    name: Nivel 1 · Jefe · validar y entregar al propietario
    needs: gerente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gerente
          path: reports
      - name: Validar, priorizar y registrar informe para el panel
        run: python3 scripts/pipeline.py jefe --input reports --output out
        env:
          GH_REPORT_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-jefe-y-recibo
          path: out/*.json
          retention-days: 90
