name: Publicar la Sala (GitHub Pages)
# Cada cambio en main publica la app en https://soobroon-beep.github.io/sala-de-agentes/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Pruebas
        run: node --test tests/*.test.js
      - name: Preparar sitio
        run: mkdir -p dist && rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'dist' --exclude 'server' --exclude '*.md' ./ dist/
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - id: deploy
        uses: actions/deploy-pages@v4
